services:
  app:
    build: .
    container_name: experiment-1
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Comment out to use the bgutil provider sidecar below:
      # YT_PO_PROVIDER_URL: http://127.0.0.1:4416
    restart: unless-stopped

  # Optional — PO-token provider sidecar (see POTOKEN.md). The app mints
  # Proof-of-Origin tokens through it (default http://127.0.0.1:4416) so
  # yt-dlp can bypass YouTube's datacenter-IP bot-wall. Only needed when the
  # sandbox IP is blocked; uncomment to enable:
  #
  # pot-provider:
  #   image: brainicism/bgutil-ytdlp-pot-provider:latest
  #   container_name: bgutil-pot-provider
  #   restart: unless-stopped
  #   network_mode: service:app   # localhost-only access from the app
