# Docker is the SECONDARY deployment route for this project — the primary
# runtime is Freebuff Cloud (repo scripts + pinned runtime bootstrap, no
# Docker). This compose file remains a valid self-hosted option.
#
# Secrets are read from the shell environment / an optional .env next to
# this file (docker compose interpolates ${VAR} automatically). Never commit
# real secrets. ACCESS_KEY + SESSION_SECRET are REQUIRED for production
# (auth fails CLOSED when they are missing unless AUTH_DISABLED=true).
services:
  app:
    build: .
    container_name: experiment-1
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      ACCESS_KEY: ${ACCESS_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      ENABLE_DIAGNOSTICS: ${ENABLE_DIAGNOSTICS:-false}
      YT_DLP_CONCURRENCY: ${YT_DLP_CONCURRENCY:-2}
      YT_DLP_QUEUE_MAX: ${YT_DLP_QUEUE_MAX:-16}
      YT_PROXY_URL: ${YT_PROXY_URL:-}
      YT_PLAYER_CLIENTS: ${YT_PLAYER_CLIENTS:-}
      KEEPALIVE_ENABLED: ${KEEPALIVE_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
