plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Web app URL baked into BuildConfig.WEBAPP_URL at build time.
//
// Priority: -PWEBAPP_URL="https://..." on the command line → the WEBAPP_URL
// property in gradle.properties → (debug only) a localhost default.
//
// Release builds FAIL unless WEBAPP_URL is an https URL with a valid host:
// never ship a release APK pointed at localhost, an HTTP URL, or garbage.
// Debug builds accept http only for local development hosts.
def wantsRelease = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
def rawWebappUrl = (project.findProperty('WEBAPP_URL') ?: '').toString().trim()

def validateWebAppUrl(String url, boolean release) {
    if (url.isEmpty()) {
        if (release) {
            throw new GradleException(
                'WEBAPP_URL is required for release builds — pass -PWEBAPP_URL=https://your-deployment.example'
            )
        }
        return 'http://localhost:3000'
    }
    java.net.URI uri
    try {
        uri = new java.net.URI(url)
    } catch (e) {
        throw new GradleException("WEBAPP_URL '$url' is not a valid URL", e)
    }
    def scheme = uri.getScheme()
    def host = uri.getHost()
    if (scheme == null || host == null || uri.getRawUserInfo() != null) {
        throw new GradleException(
            "WEBAPP_URL '$url' must be an absolute http(s) URL with a host and no embedded credentials"
        )
    }
    def https = scheme.equalsIgnoreCase('https')
    if (release && !https) {
        throw new GradleException(
            "Release builds require an HTTPS WEBAPP_URL — got '$url'. " +
            'Point it at the public Freebuff deployment; debug builds may use localhost.'
        )
    }
    if (https) return url
    // Debug http: only local development hosts are acceptable.
    def hostLc = host.toLowerCase()
    def devHosts = ['localhost', '127.0.0.1', '10.0.2.2']
    if (!devHosts.contains(hostLc)) {
        throw new GradleException(
            "Debug HTTP WEBAPP_URL '$url' must target a local dev host (${devHosts.join(', ')}). " +
            'Use an https URL for any real deployment.'
        )
    }
    return url
}
def webappUrl = validateWebAppUrl(rawWebappUrl, wantsRelease)

android {
    namespace 'com.familytube'
    compileSdk 34

    // Optional release signing. When the STORE_FILE gradle property is set
    // the release APK is signed and installable directly; otherwise release
    // builds produce an unsigned APK (see android/README.md — debug builds
    // are auto-signed and install as-is).
    signingConfigs {
        release {
            def storeFileProp = project.findProperty('STORE_FILE')
            if (storeFileProp) {
                storeFile file(storeFileProp)
                storePassword project.findProperty('STORE_PASSWORD')
                keyAlias project.findProperty('KEY_ALIAS')
                keyPassword project.findProperty('KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId "com.familytube"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "WEBAPP_URL", "\"${webappUrl}\""

        // We are far below the method limit, but multidex costs nothing and
        // protects against surprises on very old low-end devices.
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            def storeFileProp = project.findProperty('STORE_FILE')
            if (storeFileProp) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    testOptions {
        unitTests.all {
            // AppSecurity is pure JVM; keep default JUnit behaviour.
            it.useJUnit()
        }
    }
}

tasks.whenTaskAdded { task ->
    // Fail fast on any release task (assembleRelease, bundleRelease, …)
    // with a missing/insecure WEBAPP_URL instead of building a bad APK.
    if (task.name.toLowerCase().contains('release')) {
        validateWebAppUrl(rawWebappUrl, true)
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    testImplementation 'junit:junit:4.13.2'
}
