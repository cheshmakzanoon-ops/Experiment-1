// Top-level build file.
//
// This project deliberately stays on classic Groovy DSL: it is a small,
// single-module wrapper that must build from a bare command line (no
// Android Studio) with AGP 8.2.2 + Gradle 8.5 + JDK 17.
buildscript {
    ext {
        kotlin_version = '1.9.22'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
